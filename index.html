<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자책 Flipbook 뷰어 (필기/메모 지원)</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      height: 50px;
      padding: 0 15px;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d2d2d;
      z-index: 10;
      flex-shrink: 0;
    }
    .title-area h2 { font-size: 0.95rem; color: #f3f4f6; font-weight: 500; }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .file-btn-wrapper { position: relative; display: inline-block; }
    .btn {
      background-color: #3b82f6;
      color: white;
      padding: 6px 12px;
      font-size: 0.8rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #2563eb; }
    .btn-nav { background-color: #374151; }
    .btn-nav:hover { background-color: #4b5563; }
    .btn-tool { background-color: #4b5563; }
    .btn-tool.active { background-color: #2563eb; outline: 2px solid #60a5fa; }
    input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .page-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: #9ca3af;
      background: #111827;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #374151;
    }
    
    .toolbar-divider { width: 1px; height: 20px; background-color: #4b5563; margin: 0 4px; }
    input[type="color"] { border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; background: transparent; }

    #viewer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: calc(100vh - 50px);
      padding: 10px;
      overflow: hidden;
      position: relative;
      background: #181818;
    }
    #book {
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .my-page {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    .my-page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      user-select: none;
    }
    .drawing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }
    .drawing-canvas.active { cursor: crosshair; pointer-events: auto; }
    .drawing-canvas.text-mode { cursor: text; pointer-events: auto; }

    .memo-text {
      position: absolute;
      background: rgba(255, 255, 180, 0.95);
      color: #111;
      border: 1px solid #d97706;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.85rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 10;
      max-width: 200px;
      word-break: break-all;
      pointer-events: auto;
    }

    #loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #loading-overlay.active { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
      border-left-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h2>📖 필기 및 메모 지원 E-Book</h2>
    </div>
    <div class="controls">
      <div class="file-btn-wrapper">
        <button class="btn">📁 파일 열기</button>
        <input type="file" id="fileInput" multiple accept=".zip,.pdf,image/*">
      </div>

      <div class="toolbar-divider"></div>

      <button class="btn btn-tool active" id="toolView" title="책장 넘기기 모드">🖐️ 읽기</button>
      <button class="btn btn-tool" id="toolPen" title="볼펜 필기">✏️ 펜</button>
      <button class="btn btn-tool" id="toolHighlighter" title="형광펜 밑줄">🖍️ 형광펜</button>
      <button class="btn btn-tool" id="toolText" title="텍스트 메모 입력">📝 메모</button>
      <button class="btn btn-tool" id="toolEraser" title="지우개">🧹 지우개</button>
      <input type="color" id="toolColor" value="#ff0000" title="색상 선택">
      <button class="btn btn-nav" id="clearCanvasBtn" title="현재 페이지 필기 삭제">🗑️ 필기 초기화</button>

      <div class="toolbar-divider"></div>

      <button class="btn btn-nav" id="prevBtn">◀ 이전</button>
      <span class="page-indicator" id="pageNumber">0 / 0</span>
      <button class="btn btn-nav" id="nextBtn">다음 ▶</button>
    </div>
  </header>

  <div id="viewer-container">
    <div id="book"></div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loadingText">파일 처리 중...</div>
  </div>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    }
    
    let pageFlip = null;
    let currentTool = 'view';
    let activeColor = '#ff0000';

    const fileInput = document.getElementById('fileInput');
    const pageNumber = document.getElementById('pageNumber');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loadingText');
    const bookContainer = document.getElementById('book');

    const toolBtns = {
      view: document.getElementById('toolView'),
      pen: document.getElementById('toolPen'),
      highlighter: document.getElementById('toolHighlighter'),
      text: document.getElementById('toolText'),
      eraser: document.getElementById('toolEraser')
    };
    const colorPicker = document.getElementById('toolColor');
    const clearCanvasBtn = document.getElementById('clearCanvasBtn');

    Object.keys(toolBtns).forEach(tool => {
      toolBtns[tool].addEventListener('click', () => setTool(tool));
    });

    colorPicker.addEventListener('change', (e) => activeColor = e.target.value);

    function setTool(tool) {
      currentTool = tool;
      Object.keys(toolBtns).forEach(k => {
        if (k === tool) toolBtns[k].classList.add('active');
        else toolBtns[k].classList.remove('active');
      });

      const canvases = document.querySelectorAll('.drawing-canvas');
      canvases.forEach(canvas => {
        canvas.classList.remove('active', 'text-mode');
        if (tool !== 'view') {
          canvas.classList.add(tool === 'text' ? 'text-mode' : 'active');
        }
      });
    }

    window.addEventListener('keydown', (e) => {
      if (currentTool !== 'view') return;
      if (!pageFlip) return;
      if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        pageFlip.flipNext();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        pageFlip.flipPrev();
      }
    });

    fileInput.addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      showLoading('파일 처리 중...');

      try {
        let imageUrls = [];

        if (files.length === 1 && files[0].name.toLowerCase().endsWith('.zip')) {
          imageUrls = await processZipFile(files[0]);
        } 
        else if (files.length === 1 && files[0].name.toLowerCase().endsWith('.pdf')) {
          imageUrls = await processPdfFile(files[0]);
        } 
        else {
          imageUrls = await processImageFiles(files);
        }

        if (imageUrls.length === 0) {
          alert('이미지를 찾을 수 없습니다.');
          hideLoading();
          return;
        }

        await renderBook(imageUrls);

      } catch (err) {
        alert('처리 오류: ' + err.message);
      } finally {
        hideLoading();
      }
    });

    prevBtn.addEventListener('click', () => { if (pageFlip) pageFlip.flipPrev(); });
    nextBtn.addEventListener('click', () => { if (pageFlip) pageFlip.flipNext(); });

    clearCanvasBtn.addEventListener('click', () => {
      const activePages = bookContainer.querySelectorAll('.my-page');
      activePages.forEach(page => {
        const canvas = page.querySelector('canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        const memos = page.querySelectorAll('.memo-text');
        memos.forEach(m => m.remove());
      });
    });

    async function processZipFile(zipFile) {
      const zip = new JSZip();
      const zipContent = await zip.loadAsync(zipFile);
      const imageEntries = [];

      zipContent.forEach((relativePath, zipEntry) => {
        if (!zipEntry.dir && /\.(jpg|jpeg|png|webp|gif|bmp)$/i.test(zipEntry.name)) {
          imageEntries.push(zipEntry);
        }
      });

      imageEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      const urls = [];
      for (let i = 0; i < imageEntries.length; i++) {
        loadingText.textContent = `ZIP 처리 중... (${i + 1}/${imageEntries.length})`;
        const base64 = await zipEntriesToBase64(imageEntries[i]);
        urls.push(base64);
      }
      return urls;
    }

    function zipEntriesToBase64(zipEntry) {
      return new Promise((resolve) => {
        zipEntry.async('base64').then(data => {
          const ext = zipEntry.name.split('.').pop().toLowerCase();
          const mime = ext === 'png' ? 'image/png' : 'image/jpeg';
          resolve(`data:${mime};base64,${data}`);
        });
      });
    }

    async function processPdfFile(pdfFile) {
      const arrayBuffer = await pdfFile.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const urls = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        loadingText.textContent = `PDF 변환 중... (${pageNum}/${pdf.numPages})`;
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.5 });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        urls.push(canvas.toDataURL('image/jpeg', 0.85));
      }
      return urls;
    }

    async function processImageFiles(imageFiles) {
      const validImages = imageFiles.filter(f => f.type.startsWith('image/'));
      validImages.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
      
      const promises = validImages.map(file => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      });

      return Promise.all(promises);
    }

    async function renderBook(imageUrls) {
      bookContainer.innerHTML = '';
      if (pageFlip) {
        try { pageFlip.destroy(); } catch(e){}
        pageFlip = null;
      }

      let naturalAspect = 0.707;

      const imgPromises = imageUrls.map((url, index) => {
        return new Promise((resolve) => {
          const page = document.createElement('div');
          page.className = 'my-page';

          const img = document.createElement('img');
          img.onload = () => {
            if (index === 0 && img.naturalWidth && img.naturalHeight) {
              naturalAspect = img.naturalWidth / img.naturalHeight;
            }
            setupPageCanvas(page, img.naturalWidth, img.naturalHeight);
            resolve();
          };
          img.onerror = () => resolve();
          img.src = url;
          page.appendChild(img);
          bookContainer.appendChild(page);
        });
      });

      await Promise.all(imgPromises);

      const containerHeight = document.getElementById('viewer-container').clientHeight - 20;
      const calculatedWidth = Math.floor(containerHeight * naturalAspect);

      const PageFlipClass = window.St ? window.St.PageFlip : window.PageFlip;

      pageFlip = new PageFlipClass(bookContainer, {
        width: calculatedWidth,
        height: containerHeight,
        size: "fixed",
        minWidth: 100,
        maxWidth: 2000,
        minHeight: 100,
        maxHeight: 2000,
        maxShadowOpacity: 0.4,
        showCover: true,
        useMouseEvents: false /* 마우스 터치/드래그 오동작 차단 */
      });

      const pages = bookContainer.querySelectorAll('.my-page');
      if (pages.length > 0) {
        pageFlip.loadFromHTML(pages);
        updatePageIndicator();

        pageFlip.on('flip', (e) => {
          updatePageIndicator();
        });
      }
      
      setTool('view');
    }

    function setupPageCanvas(pageElement, width, height) {
      const canvas = document.createElement('canvas');
      canvas.className = 'drawing-canvas';
      canvas.width = width || 800;
      canvas.height = height || 1100;
      pageElement.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches[0]) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        }

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
          rawX: clientX - rect.left,
          rawY: clientY - rect.top
        };
      }

      function startDrawing(e) {
        if (currentTool === 'view') return;
        const pos = getPos(e);

        if (currentTool === 'text') {
          const memoText = prompt('추가할 메모를 입력하세요:');
          if (memoText) {
            const memoDiv = document.createElement('div');
            memoDiv.className = 'memo-text';
            memoDiv.style.left = pos.rawX + 'px';
            memoDiv.style.top = pos.rawY + 'px';
            memoDiv.textContent = memoText;
            pageElement.appendChild(memoDiv);
          }
          return;
        }

        isDrawing = true;
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        if (!isDrawing || currentTool === 'view' || currentTool === 'text') return;
        e.preventDefault();
        const pos = getPos(e);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);

        if (currentTool === 'pen') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = activeColor;
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
        } else if (currentTool === 'highlighter') {
          ctx.globalCompositeOperation = 'source-over';
          const r = parseInt(activeColor.slice(1,3), 16) || 255;
          const g = parseInt(activeColor.slice(3,5), 16) || 255;
          const b = parseInt(activeColor.slice(5,7), 16) || 0;
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.35)`;
          ctx.lineWidth = 24;
          ctx.lineCap = 'square';
          ctx.lineJoin = 'miter';
        } else if (currentTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = 30;
          ctx.lineCap = 'round';
        }

        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);
    }

    function updatePageIndicator() {
      if (!pageFlip) return;
      const totalPages = pageFlip.getPageCount();
      const currentPage = pageFlip.getCurrentPageIndex() + 1;
      pageNumber.textContent = `${currentPage} / ${totalPages}`;
    }

    function showLoading(msg) { loadingText.textContent = msg; loadingOverlay.classList.add('active'); }
    function hideLoading() { loadingOverlay.classList.remove('active'); }
  </script>
</body>
</html>
